<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1520">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>横浜市 天気ディスプレイ</title>
  <style>
    :root{
      --bg1:#0b1520;
      --bg2:#16283a;
      --panel:rgba(255,255,255,.075);
      --panel2:rgba(255,255,255,.11);
      --text:#f5f9fd;
      --muted:rgba(245,249,253,.66);
      --line:rgba(255,255,255,.10);
      --ok:#6fd6aa;
      --warn:#ffd166;
      --error:#ff8d7d;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg1);color:var(--text)}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
      overflow-y:auto;
    }
    .app{
      min-height:100vh;
      min-height:100dvh;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:clamp(12px,1.8vw,24px);
      padding:max(env(safe-area-inset-top),20px)
              max(env(safe-area-inset-right),24px)
              max(env(safe-area-inset-bottom),18px)
              max(env(safe-area-inset-left),24px);
      background:
        radial-gradient(circle at 84% 12%,rgba(105,170,235,.16),transparent 30%),
        radial-gradient(circle at 10% 88%,rgba(85,210,190,.08),transparent 28%),
        linear-gradient(145deg,var(--bg1),var(--bg2));
    }
    header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    .place{font-size:clamp(24px,3vw,42px);font-weight:720;letter-spacing:.01em}
    .kicker{font-size:clamp(12px,1.2vw,16px);color:var(--muted);margin-top:5px}
    .clock{text-align:right}
    #time{font-size:clamp(58px,8.5vw,119px);font-weight:300;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
    #date{font-size:clamp(12px,1.3vw,17px);color:var(--muted);margin-top:7px}

    main{
      display:grid;
      grid-template-columns:minmax(0,1.02fr) minmax(0,1.38fr);
      gap:clamp(12px,1.8vw,24px);
      min-height:0;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:clamp(20px,2.5vw,34px);
      box-shadow:0 20px 55px rgba(0,0,0,.22);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .current{
      padding:clamp(22px,3vw,44px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-width:0;
    }
    .weather-main{display:flex;align-items:center;gap:clamp(16px,2.3vw,30px)}
    #icon{font-size:clamp(64px,9vw,130px);line-height:1}
    #temp{font-size:clamp(76px,10vw,138px);font-weight:250;letter-spacing:-.075em;line-height:.9}
    .deg{font-size:.46em;vertical-align:top;margin-left:2px;letter-spacing:0}
    #condition{font-size:clamp(20px,2.5vw,34px);font-weight:650;margin-top:20px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:clamp(20px,2.5vw,34px)}
    .metric{padding:14px 9px;border-radius:18px;background:rgba(255,255,255,.05);text-align:center}
    .metric-label{font-size:clamp(10px,1vw,14px);color:var(--muted)}
    .metric-value{font-size:clamp(18px,2vw,28px);font-weight:680;margin-top:4px}

    .right{display:grid;grid-template-rows:auto 1fr;gap:clamp(12px,1.8vw,22px);min-width:0}
    .notice{
      padding:clamp(16px,2vw,24px) clamp(18px,2.4vw,30px);
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      min-height:86px;
    }
    .notice-left{display:flex;align-items:center;gap:15px;min-width:0}
    #noticeIcon{font-size:clamp(28px,3.7vw,48px)}
    #noticeTitle{font-size:clamp(16px,1.8vw,25px);font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #noticeDetail{font-size:clamp(11px,1.25vw,16px);color:var(--muted);margin-top:3px}
    .tomorrow{text-align:right;white-space:nowrap}
    .tomorrow .label{font-size:clamp(10px,1vw,14px);color:var(--muted)}
    #tomorrowLine{font-size:clamp(15px,1.7vw,23px);font-weight:670;margin-top:3px}

    .forecast{padding:clamp(18px,2.3vw,30px);display:flex;flex-direction:column;min-height:0}
    .section-title{font-size:clamp(13px,1.35vw,18px);font-weight:680;color:rgba(246,251,255,.87);margin-bottom:13px}
    .hours{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;min-height:0}
    .hour{
      border-radius:22px;background:var(--panel2);padding:clamp(12px,1.6vw,20px) 8px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0;
    }
    .hour-time{font-size:clamp(12px,1.35vw,18px);color:var(--muted)}
    .hour-icon{font-size:clamp(28px,3.6vw,50px);line-height:1}
    .hour-temp{font-size:clamp(22px,2.8vw,38px);font-weight:650}
    .rain{font-size:clamp(11px,1.25vw,16px);color:#bedcff}

    footer{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      color:rgba(246,251,255,.50);font-size:clamp(9px,.95vw,13px)
    }
    .status-left{display:flex;align-items:center;gap:7px;min-width:0}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px rgba(111,214,170,.65);flex:none}
    .offline .dot{background:var(--warn);box-shadow:0 0 12px rgba(255,209,102,.55)}
    .error .dot{background:var(--error);box-shadow:0 0 12px rgba(255,141,125,.55)}
    #statusText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .badge{padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.035)}

    @media (orientation:portrait){
      body{overflow:auto}
      .app{min-height:100dvh}
      main{grid-template-columns:1fr}
      .hours{min-height:280px}
    }
    @media (max-width:640px){
      .app{padding:20px 18px}
      .notice{align-items:flex-start}
      .tomorrow{white-space:normal}
    }

    html{scroll-behavior:smooth}
    a{color:inherit}
    a:focus-visible{outline:2px solid #bedcff;outline-offset:5px}
    .scroll-hint{text-decoration:none;color:#bedcff;white-space:nowrap;padding:8px}
    .week{padding:32px max(24px,env(safe-area-inset-right)) 40px max(24px,env(safe-area-inset-left));background:linear-gradient(145deg,var(--bg1),var(--bg2));min-height:55vh}
    .week-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
    .week h2{font-size:clamp(24px,3vw,38px);margin:0 0 6px}
    .week-description,.week-note{color:var(--muted);font-size:14px;line-height:1.7}
    .week-description{margin:0}
    .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
    .day{padding:24px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;min-width:0}
    .day.today{border-color:rgba(190,220,255,.5);background:rgba(190,220,255,.12)}
    .day-label{font-size:18px;font-weight:700}
    .day-date{color:var(--muted);font-size:13px;margin-top:5px}
    .day-icon{font-size:44px;line-height:1.2}
    .day-condition{font-size:13px;min-height:2.8em;display:flex;align-items:center;justify-content:center}
    .day-temperatures{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:23px;font-weight:650}
    .day-high{color:#ffd1a9}.day-low{color:#bedcff}
    .week-note{margin:22px 0 0}
    @media (max-width:900px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media (orientation:portrait){.hours{min-height:180px}.current{padding:24px}.app{gap:16px}}
    @media (max-width:640px){
      #time{font-size:clamp(58px,14vw,90px)}
      .days{grid-template-columns:repeat(2,minmax(0,1fr))}
      .week{padding:28px 18px}.day:last-child{grid-column:1/-1}
      footer{flex-wrap:wrap;gap:6px}.badge{font-size:10px}
      .weather-main{gap:16px}.week-heading{align-items:flex-start}
    }
    @media (orientation:landscape) and (max-height:650px){
      .app{padding-top:14px;padding-bottom:12px;gap:12px}
      .current{padding:20px}.metrics{margin-top:18px}.metric{padding:10px 6px}
      #condition{margin-top:14px}.notice{min-height:72px;padding:14px 18px}
      .forecast{padding:16px}.hour{padding:12px 8px}.right{gap:12px}
    }
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="app" id="top">
    <header>
      <div>
        <div class="place">横浜市</div>
        <div class="kicker">今日の天気</div>
      </div>
      <div class="clock">
        <div id="time">--:--</div>
        <div id="date">----年--月--日</div>
      </div>
    </header>

    <main>
      <section class="card current">
        <div class="weather-main">
          <div id="icon">–</div>
          <div id="temp">--<span class="deg">°</span></div>
        </div>
        <div id="condition">天気情報を取得中</div>

        <div class="metrics">
          <div class="metric">
            <div class="metric-label">最高</div>
            <div class="metric-value" id="high">--°</div>
          </div>
          <div class="metric">
            <div class="metric-label">最低</div>
            <div class="metric-value" id="low">--°</div>
          </div>
          <div class="metric">
            <div class="metric-label">湿度</div>
            <div class="metric-value" id="humidity">--%</div>
          </div>
        </div>
      </section>

      <section class="right">
        <div class="card notice">
          <div class="notice-left">
            <div id="noticeIcon">☂️</div>
            <div>
              <div id="noticeTitle">降水確率を確認中</div>
              <div id="noticeDetail">今日の予報を読み込んでいます</div>
            </div>
          </div>
          <div class="tomorrow">
            <div class="label">明日</div>
            <div id="tomorrowLine">--</div>
          </div>
        </div>

        <div class="card forecast">
          <div class="section-title">これからの天気</div>
          <div class="hours" id="hours"></div>
        </div>
      </section>
    </main>

    <footer id="status">
      <div class="status-left">
        <span class="dot"></span>
        <span id="statusText">起動中</span>
      </div>
      <a class="scroll-hint" href="#weekly">7日間の天気 ↓</a>
      <span class="badge">10分ごとに自動更新</span>
    </footer>
  </div>

  <section class="week" id="weekly" aria-labelledby="week-title">
    <div class="week-heading">
      <div><h2 id="week-title">7日間の天気</h2><p class="week-description">横浜市 · 今日から1週間の予報</p></div>
      <a class="scroll-hint" href="#top">時計へ戻る ↑</a>
    </div>
    <div class="days" id="days"><p>週間予報を読み込んでいます</p></div>
    <p class="week-note">最高気温 / 最低気温 · 降水は1日の最大降水確率<br><span id="weekStatus"></span><br>気象データ：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </section>
<script>
(() => {
  // 横浜市中心部付近。自宅の詳細位置は使っていません。
  const LAT = 35.4437;
  const LON = 139.6380;
  const CACHE_KEY = "yokohama-weather-cache-v3";

  const API = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
    + `&current=temperature_2m,relative_humidity_2m,weather_code,is_day`
    + `&hourly=temperature_2m,precipitation_probability,weather_code`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
    + `&timezone=Asia%2FTokyo&forecast_days=7`;

  const $ = id => document.getElementById(id);

  const WEATHER = {
    0:["快晴","☀️"],1:["晴れ","🌤️"],2:["晴れ時々くもり","⛅"],3:["くもり","☁️"],
    45:["霧","🌫️"],48:["着氷性の霧","🌫️"],
    51:["弱い霧雨","🌦️"],53:["霧雨","🌦️"],55:["強い霧雨","🌧️"],
    56:["弱い着氷性霧雨","🌧️"],57:["強い着氷性霧雨","🌧️"],
    61:["弱い雨","🌦️"],63:["雨","🌧️"],65:["強い雨","🌧️"],
    66:["弱い着氷性の雨","🌧️"],67:["強い着氷性の雨","🌧️"],
    71:["弱い雪","🌨️"],73:["雪","🌨️"],75:["強い雪","❄️"],77:["霧雪","❄️"],
    80:["弱いにわか雨","🌦️"],81:["にわか雨","🌧️"],82:["激しいにわか雨","⛈️"],
    85:["弱いにわか雪","🌨️"],86:["強いにわか雪","❄️"],
    95:["雷雨","⛈️"],96:["雹を伴う雷雨","⛈️"],99:["激しい雹を伴う雷雨","⛈️"]
  };

  function weather(code){
    return WEATHER[code] || ["天気","🌤️"];
  }

  function tickClock(){
    const now = new Date();
    $("time").textContent = new Intl.DateTimeFormat("ja-JP",{
      hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Tokyo"
    }).format(now);

    $("date").textContent = new Intl.DateTimeFormat("ja-JP",{
      year:"numeric",month:"long",day:"numeric",weekday:"short",timeZone:"Asia/Tokyo"
    }).format(now);
  }

  function japanDate(offset = 0){
    return new Date(Date.now() + 9*60*60*1000 + offset*86400000).toISOString().slice(0,10);
  }
  const number = value => Number.isFinite(value) ? Math.round(value) : "--";
  function nextForecastIndices(times){
    return times.map((time,i) => ({time,i}))
      .filter(item => new Date(item.time+"+09:00").getTime() > Date.now() && Number(item.time.slice(11,13)) % 3 === 0)
      .slice(0,4).map(item => item.i);
  }
  function renderWeek(data, meta){
    const daily = data.daily;
    $("days").innerHTML = Array.from({length:7}, (_,n) => {
      const date = japanDate(n);
      const i = daily.time.indexOf(date);
      const dt = new Date(date+"T12:00:00+09:00");
      const label = n === 0 ? "今日" : new Intl.DateTimeFormat("ja-JP",{weekday:"short",timeZone:"Asia/Tokyo"}).format(dt);
      const stamp = `${Number(date.slice(5,7))}/${Number(date.slice(8,10))}`;
      const [condition, icon] = i < 0 ? ["予報未取得","—"] : weather(daily.weather_code[i]);
      return `<article class="card day ${n===0 ? 'today' : ''}">
        <div><div class="day-label">${label}</div><div class="day-date">${stamp}</div></div>
        <div class="day-icon" aria-hidden="true">${icon}</div><div class="day-condition">${condition}</div>
        <div class="day-temperatures"><span class="day-high" aria-label="最高気温">${number(daily.temperature_2m_max[i])}°</span><span class="day-low" aria-label="最低気温">${number(daily.temperature_2m_min[i])}°</span></div>
        <div class="rain">降水 ${number(daily.precipitation_probability_max[i])}%</div>
      </article>`;
    }).join("");
    $("weekStatus").textContent = meta.cached ? "保存済みの予報を表示中。通信回復後に自動更新します。" : "10分ごとに自動更新。予報は変わることがあります。";
  }

  function setRainNotice(maxRain){
    if(!Number.isFinite(maxRain)){
      $("noticeIcon").textContent = "—";
      $("noticeTitle").textContent = "降水確率は未取得";
      $("noticeDetail").textContent = "通信回復後に更新します";
    }else if(maxRain >= 70){
      $("noticeIcon").textContent = "☂️";
      $("noticeTitle").textContent = "今日は傘が必要";
      $("noticeDetail").textContent = `今日の最大降水確率 ${maxRain}%`;
    }else if(maxRain >= 40){
      $("noticeIcon").textContent = "🌂";
      $("noticeTitle").textContent = "折りたたみ傘がおすすめ";
      $("noticeDetail").textContent = `今日の最大降水確率 ${maxRain}%`;
    }else{
      $("noticeIcon").textContent = "✓";
      $("noticeTitle").textContent = "雨の心配は小さめ";
      $("noticeDetail").textContent = `今日の最大降水確率 ${maxRain}%`;
    }
  }

  function render(data, meta = {}){
    renderWeek(data, meta);
    const today = data.daily.time.indexOf(japanDate());
    const tomorrow = data.daily.time.indexOf(japanDate(1));
    const [condition, icon] = weather(data.current.weather_code);

    $("icon").textContent = icon;
    $("temp").innerHTML = `${number(data.current.temperature_2m)}<span class="deg">°</span>`;
    $("condition").textContent = condition;
    $("humidity").textContent = `${number(data.current.relative_humidity_2m)}%`;
    $("high").textContent = `${number(data.daily.temperature_2m_max[today])}°`;
    $("low").textContent = `${number(data.daily.temperature_2m_min[today])}°`;

    const maxRain = data.daily.precipitation_probability_max[today];
    setRainNotice(maxRain);

    const [, tomorrowIcon] = weather(data.daily.weather_code[tomorrow]);
    $("tomorrowLine").textContent =
      `${tomorrow < 0 ? "—" : tomorrowIcon} ${number(data.daily.temperature_2m_max[tomorrow])}° / ${number(data.daily.temperature_2m_min[tomorrow])}°`;

    const idxs = nextForecastIndices(data.hourly.time);
    $("hours").innerHTML = idxs.map(i => {
      const hh = data.hourly.time[i].slice(11,13);
      const [, ic] = weather(data.hourly.weather_code[i]);
      const rain = number(data.hourly.precipitation_probability[i]);

      return `<div class="hour">
        <div class="hour-time">${hh}:00</div>
        <div class="hour-icon">${ic}</div>
        <div class="hour-temp">${number(data.hourly.temperature_2m[i])}°</div>
        <div class="rain">降水 ${rain}%</div>
      </div>`;
    }).join("") || "<p>今後の時間別予報は未取得です</p>";

    const status = $("status");
    status.classList.remove("offline","error");

    if(meta.cached){
      status.classList.add("offline");
      const when = meta.updatedAt
        ? new Intl.DateTimeFormat("ja-JP",{
            month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Tokyo"
          }).format(new Date(meta.updatedAt))
        : "不明";
      $("statusText").textContent = `保存データ表示・最終取得 ${when}`;
    }else{
      const when = new Intl.DateTimeFormat("ja-JP",{
        hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Tokyo"
      }).format(new Date());
      $("statusText").textContent = `更新 ${when} ・ Open-Meteo`;
    }
  }

  function saveCache(data){
    try{
      localStorage.setItem(CACHE_KEY, JSON.stringify({
        updatedAt: Date.now(),
        data
      }));
    }catch(_){}
  }

  function loadCache(){
    try{
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      return validData(cached?.data) ? cached : null;
    }catch(_){
      return null;
    }
  }

  function validData(data){
    return data && data.current && data.daily && data.hourly
      && ["time","weather_code","temperature_2m_max","temperature_2m_min","precipitation_probability_max"].every(key => Array.isArray(data.daily[key]))
      && ["time","weather_code","temperature_2m","precipitation_probability"].every(key => Array.isArray(data.hourly[key]));
  }
  let loading = false;
  async function loadWeather(){
    if(loading) return;
    loading = true;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 10000);
    try{

      const response = await fetch(API,{
        cache:"no-store",
        signal:controller.signal
      });


      if(!response.ok){
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      if(!validData(data)) throw new Error("Invalid weather data");
      render(data,{cached:false});
      saveCache(data);
    }catch(error){
      const cached = loadCache();

      if(cached?.data){
        render(cached.data,{
          cached:true,
          updatedAt:cached.updatedAt
        });
      }else{
        const status = $("status");
        status.classList.remove("offline");
        status.classList.add("error");
        $("statusText").textContent = "天気データを取得できません";
        $("condition").textContent = "通信エラー";
        $("days").textContent = "週間予報を取得できません。通信回復後に自動更新します。";
      }
    }finally{
      clearTimeout(timer);
      loading = false;
    }
  }

  function handleConnectivity(){
    if(navigator.onLine){
      loadWeather();
    }else{
      const cached = loadCache();
      if(cached?.data){
        render(cached.data,{
          cached:true,
          updatedAt:cached.updatedAt
        });
      }
    }
  }

  tickClock();
  setInterval(tickClock,1000);

  const cached = loadCache();
  if(cached?.data){
    render(cached.data,{
      cached:true,
      updatedAt:cached.updatedAt
    });
  }

  loadWeather();
  setInterval(loadWeather,10*60*1000);

  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden) loadWeather();
  });

  window.addEventListener("online",handleConnectivity);
  window.addEventListener("offline",handleConnectivity);

  window.addEventListener("pageshow",event=>{ if(event.persisted) loadWeather(); });
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load",()=>{
      navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).then(registration=>{
        setInterval(()=>registration.update().catch(()=>{}),60*60*1000);
      }).catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
