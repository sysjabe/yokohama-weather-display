name: Update rail status and publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Read official rail status
        run: node collect-rail.cjs
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest rail-status.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
